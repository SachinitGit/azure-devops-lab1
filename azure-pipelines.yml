parameters:
- name: Environment
  displayName: Environment
  type: string
  default: Production
  values:
  - Development
  - Testing
  - Production


trigger:
- main

variables:
- group: Lab6-Variables

pool:
  vmImage: ubuntu-latest

stages:

- stage: Build
  displayName: 'Build Stage'

  jobs:

  - job: BuildJob
    displayName: 'Build Job'

    steps:

    - script: |
        echo "Web App: $(WebAppName)"
        echo "Selected Environment: ${{ parameters.Environment }}"
        echo "Lab 9 Testing"
      displayName: 'Display Variables'

    - ${{ if eq(parameters.Environment, 'Development') }}:
      - script: echo "Development Environment Selected"
        displayName: 'Development Message'

    - ${{ if eq(parameters.Environment, 'Production') }}:
      - script: echo "Production Environment Selected"
        displayName: 'Production Message'

    - template: build-template.yml

    - task: CopyFiles@2
      inputs:
        Contents: '**'
        TargetFolder: '$(Build.ArtifactStagingDirectory)'
      displayName: 'Copy HTML and CSS Files'

    - task: PublishBuildArtifacts@1
      inputs:
        PathtoPublish: '$(Build.ArtifactStagingDirectory)'
        ArtifactName: 'website'
        publishLocation: 'Container'
      displayName: 'Publish Artifact'

- stage: Deploy_Dev
  displayName: 'Deploy To Dev'
  dependsOn: Build

  jobs:
  - deployment: DeployDev
    environment: dev

    strategy:
      runOnce:
        deploy:
          steps:

          - task: DownloadBuildArtifacts@0
            inputs:
              artifactName: 'website'
              downloadPath: '$(Pipeline.Workspace)'

          - task: AzureWebApp@1
            inputs:
              azureSubscription: 'azure-connection-lab'
              appName: '$(WebAppName)'
              package: '$(Pipeline.Workspace)/website'

- stage: Deploy_Test
  displayName: 'Deploy To Test'
  dependsOn: Deploy_Dev

  jobs:
  - deployment: DeployTest
    environment: test

    strategy:
      runOnce:
        deploy:
          steps:

          - task: DownloadBuildArtifacts@0
            inputs:
              artifactName: 'website'
              downloadPath: '$(Pipeline.Workspace)'

          - task: AzureWebApp@1
            inputs:
              azureSubscription: 'azure-connection-lab'
              appName: '$(WebAppName)'
              package: '$(Pipeline.Workspace)/website'

- stage: Deploy_Prod
  displayName: 'Deploy To Prod'
  dependsOn: Deploy_Test

  jobs:
  - deployment: DeployProd
    environment: prod

    strategy:
      runOnce:
        deploy:
          steps:

          - task: DownloadBuildArtifacts@0
            inputs:
              artifactName: 'website'
              downloadPath: '$(Pipeline.Workspace)'

          - task: AzureWebApp@1
            inputs:
              azureSubscription: 'azure-connection-lab'
              appName: '$(WebAppName)'
              package: '$(Pipeline.Workspace)/website'