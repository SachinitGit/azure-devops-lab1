parameters:
- name: Environment
  displayName: Environment
  type: string
  default: Production
  values:
  - Development
  - Testing
  - Production


trigger:
- main

variables:
- group: Lab6-Variables

pool:
  vmImage: ubuntu-latest

stages:

- stage: Build
  displayName: 'Build Stage'

  jobs:

  - job: BuildJob
    displayName: 'Build Job'

    steps:

    - script: |
        echo "Web App: $(WebAppName)"
        echo "Selected Environment: ${{ parameters.Environment }}"
      displayName: 'Display Variables'
    
    - script: echo "Development Environment Selected"
        displayName: 'Development Message'
        condition: eq('${{ parameters.Environment }}', 'Development')

    - template: build-template.yml

    - task: CopyFiles@2
      inputs:
        Contents: '**'
        TargetFolder: '$(Build.ArtifactStagingDirectory)'
      displayName: 'Copy HTML and CSS Files'

    - task: PublishBuildArtifacts@1
      inputs:
        PathtoPublish: '$(Build.ArtifactStagingDirectory)'
        ArtifactName: 'website'
        publishLocation: 'Container'
      displayName: 'Publish Artifact'

- stage: Deploy
  displayName: 'Deploy Stage'

  dependsOn: Build

  jobs:

  - deployment: DeployProd
    displayName: 'Deploy To Production'

    environment: prod

    strategy:
      runOnce:
        deploy:
          steps:

          - task: DownloadBuildArtifacts@0
            inputs:
              artifactName: 'website'
              downloadPath: '$(Pipeline.Workspace)'
            displayName: 'Download Artifact'

          - task: AzureWebApp@1
            inputs:
              azureSubscription: 'azure-connection-lab'
              appName: '$(WebAppName)'
              package: '$(Pipeline.Workspace)/website'
            displayName: 'Deploy To Azure Web App'
